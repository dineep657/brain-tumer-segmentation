<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provision doctor — BrainScan AI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin/dashboard">
      <div class="brand__mark">BS</div>
      <div>
        <div class="brand__name">BrainScan AI</div>
        <div class="brand__tag">Admin</div>
      </div>
    </a>
    <div class="topbar__actions">
      <a class="btn btn--secondary" href="/admin/dashboard">Back to dashboard</a>
      <button class="btn btn--ghost" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main class="page" style="max-width:560px;padding-top:36px;">
    <div class="page-intro">
      <h2>Provision a verified doctor</h2>
      <p>Creates a doctor account that is immediately verified. Prefer approving applications when candidates self-submit credentials.</p>
    </div>
    <div class="card">
      <div class="card__body">
        <div class="form-group">
          <label>Full name</label>
          <input class="form-input" id="docName" placeholder="Dr. Full Name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="form-input" type="email" id="docEmail" placeholder="doctor@hospital.com" />
        </div>
        <div class="form-group">
          <label>Temporary password</label>
          <input class="form-input" type="password" id="docPassword" />
        </div>
        <button class="btn btn--primary btn--block btn--lg" onclick="createDoctor()">Create verified doctor</button>
        <div id="msg"></div>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    (async () => {
      const user = await BrainScan.requireAuth(['admin']);
      if (!user) return;
    })();

    async function createDoctor() {
      const name = document.getElementById('docName').value.trim();
      const email = document.getElementById('docEmail').value.trim();
      const password = document.getElementById('docPassword').value;
      const msg = document.getElementById('msg');
      if (!name || !email || !password) {
        msg.className = 'alert alert--error';
        msg.textContent = 'All fields are required.';
        return;
      }
      const { res, data } = await BrainScan.api('/api/admin/create-doctor', {
        method: 'POST',
        headers: BrainScan.authHeaders(true),
        body: JSON.stringify({ name, email, password })
      });
      msg.className = res.ok ? 'alert alert--success' : 'alert alert--error';
      msg.textContent = res.ok ? data.message : (data.detail || 'Failed');
      if (res.ok) {
        document.getElementById('docName').value = '';
        document.getElementById('docEmail').value = '';
        document.getElementById('docPassword').value = '';
      }
    }
  </script>
</body>
</html>
