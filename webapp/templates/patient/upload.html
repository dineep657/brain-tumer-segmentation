<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload MRI — BrainScan AI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }

    nav {
      background:rgba(255,255,255,0.04);
      border-bottom:1px solid rgba(255,255,255,0.08);
      padding:16px 32px;
      display:flex; justify-content:space-between; align-items:center;
    }
    nav h1 { color:#38bdf8; font-size:1.3rem; }
    .back-btn {
      background:rgba(255,255,255,0.08); color:#94a3b8;
      border:none; padding:8px 18px; border-radius:8px; cursor:pointer; font-size:0.88rem;
    }

    /* Full width container */
    .container { max-width:1400px; margin:0 auto; padding:32px 32px; }

    /* Upload zone */
    .upload-zone {
      border:2px dashed rgba(56,189,248,0.4); border-radius:16px;
      padding:60px 40px; text-align:center; cursor:pointer;
      transition:all 0.2s; background:rgba(56,189,248,0.03);
      max-width:700px; margin:0 auto;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color:#38bdf8; background:rgba(56,189,248,0.07); }
    .upload-zone p { color:#94a3b8; margin-top:8px; font-size:0.9rem; }
    .upload-zone h3 { font-size:1.1rem; color:#e2e8f0; }
    #fileInput { display:none; }
    .btn-analyze {
      margin-top:20px; padding:12px 40px;
      background:linear-gradient(135deg,#0ea5e9,#6366f1);
      border:none; border-radius:8px; color:white; font-size:1rem;
      font-weight:600; cursor:pointer; display:none;
    }

    /* Spinner */
    .spinner { display:none; text-align:center; padding:60px; }
    .spinner-ring {
      display:inline-block; width:56px; height:56px;
      border:5px solid rgba(56,189,248,0.15); border-top-color:#38bdf8;
      border-radius:50%; animation:spin 0.8s linear infinite;
    }
    .spinner p { color:#94a3b8; margin-top:16px; font-size:0.9rem; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Metrics row */
    .metrics {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
      margin-bottom:28px;
    }
    .metric-card {
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px; padding:18px;
    }
    .metric-card .label { font-size:0.75rem; color:#94a3b8; text-transform:uppercase; letter-spacing:0.05em; }
    .metric-card .value { font-size:1.4rem; font-weight:700; color:#38bdf8; margin-top:6px; }

    /* Badges */
    .badge { display:inline-block; padding:4px 14px; border-radius:20px; font-size:0.82rem; font-weight:700; }
    .badge-tumor   { background:rgba(239,68,68,0.2);  color:#f87171; border:1px solid #ef4444; }
    .badge-notumor { background:rgba(34,197,94,0.2);  color:#4ade80; border:1px solid #22c55e; }
    .badge-lowconf { background:rgba(234,179,8,0.2);  color:#fbbf24; border:1px solid #f59e0b; }

    /* Image panels — 3 equal columns, full width, LARGE */
    .images-row {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:20px;
      margin-bottom:24px;
    }
    .img-panel {
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      overflow:hidden;
    }
    .img-panel-header {
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      display:flex; align-items:center; gap:8px;
    }
    .img-panel-header .icon { font-size:1.1rem; }
    .img-panel-header .title { font-size:0.85rem; font-weight:600; color:#e2e8f0; }
    .img-panel-header .subtitle { font-size:0.75rem; color:#64748b; margin-left:auto; }
    .img-panel-body {
      padding:12px;
      min-height:320px;
      display:flex; align-items:center; justify-content:center;
    }
    .img-panel-body img {
      width:100%;
      height:auto;
      border-radius:8px;
      display:block;
      /* Let image grow naturally — no max-height restriction */
    }
    .img-placeholder {
      text-align:center; color:#475569; padding:40px 20px;
    }
    .img-placeholder .ph-icon { font-size:2.5rem; margin-bottom:10px; }
    .img-placeholder p { font-size:0.85rem; line-height:1.5; }

    /* AI summary card */
    .summary-card {
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px; padding:20px 24px;
      margin-bottom:20px;
    }
    .summary-card h4 {
      font-size:0.78rem; color:#94a3b8; text-transform:uppercase;
      letter-spacing:0.06em; margin-bottom:14px;
    }
    .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .summary-item .key { font-size:0.78rem; color:#64748b; }
    .summary-item .val { font-size:0.95rem; color:#e2e8f0; font-weight:600; margin-top:3px; }

    /* Review cards */
    .pending-notice {
      background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.25);
      border-radius:12px; padding:18px 22px; color:#60a5fa; font-size:0.9rem;
    }
    .doctor-review {
      background:rgba(34,197,94,0.06); border:1px solid rgba(34,197,94,0.25);
      border-radius:12px; padding:22px;
    }
    .doctor-review h3 { color:#4ade80; margin-bottom:12px; font-size:1rem; }
    .doctor-review p { font-size:0.9rem; line-height:1.7; }

    .results { display:none; }
    .section-title { font-size:1.1rem; font-weight:600; margin-bottom:6px; }
    .section-sub { font-size:0.85rem; color:#64748b; margin-bottom:24px; }
  </style>
</head>
<body>

<nav>
  <h1>🧠 BrainScan AI</h1>
  <button class="back-btn" onclick="window.location='/patient/dashboard'">← Back to Dashboard</button>
</nav>

<div class="container">
  <h2 style="margin-bottom:6px;">Upload MRI Scan</h2>
  <p style="color:#94a3b8;font-size:0.9rem;margin-bottom:28px;">Upload your brain MRI. Our AI will segment and classify it — a doctor will then review the result.</p>

  <!-- Upload section -->
  <div id="uploadSection">
    <div class="upload-zone" id="dropZone"
         onclick="document.getElementById('fileInput').click()"
         ondragover="event.preventDefault();this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="handleDrop(event)">
      <div style="font-size:3.5rem">🧬</div>
      <h3 style="margin-top:12px;">Drop your MRI scan here</h3>
      <p>or click to browse — PNG, JPG, JPEG supported</p>
      <div id="fileName" style="margin-top:14px;color:#38bdf8;font-size:0.9rem;font-weight:600;"></div>
    </div>
    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg" onchange="fileSelected(event)"/>
    <div style="text-align:center;">
      <button class="btn-analyze" id="analyzeBtn" onclick="uploadScan()">🔬 Analyse Scan</button>
    </div>
  </div>

  <!-- Spinner -->
  <div class="spinner" id="spinner">
    <div class="spinner-ring"></div>
    <p>Running AI analysis — segmentation + classification + Grad-CAM...</p>
  </div>

  <!-- Results -->
  <div class="results" id="results"></div>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/';

  // Server-side role guard
  (async () => {
    try {
      const res = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) { localStorage.clear(); window.location.href = '/'; return; }
      const user = await res.json();
      if (user.role !== 'patient') { localStorage.clear(); window.location.href = '/'; }
    } catch(e) { localStorage.clear(); window.location.href = '/'; }
  })();

  let selectedFile = null;

  const params = new URLSearchParams(window.location.search);
  const scanId = params.get('scan_id');
  if (scanId) loadExistingScan(scanId);

  function fileSelected(e) {
    selectedFile = e.target.files[0];
    document.getElementById('fileName').textContent = '📎 ' + selectedFile.name;
    document.getElementById('analyzeBtn').style.display = 'inline-block';
  }

  function handleDrop(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.remove('dragover');
    selectedFile = e.dataTransfer.files[0];
    document.getElementById('fileName').textContent = '📎 ' + selectedFile.name;
    document.getElementById('analyzeBtn').style.display = 'inline-block';
  }

  async function uploadScan() {
    if (!selectedFile) return;
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('spinner').style.display = 'block';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch('/api/patient/upload', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token },
        body: formData
      });
      const data = await res.json();
      document.getElementById('spinner').style.display = 'none';

      if (!res.ok) {
        document.getElementById('uploadSection').style.display = 'block';
        alert(data.detail || 'Upload failed.');
        return;
      }
      renderResults(data, null);
    } catch(e) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('uploadSection').style.display = 'block';
      alert('Upload error: ' + e.message);
    }
  }

  async function loadExistingScan(id) {
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('spinner').style.display = 'block';
    const res = await fetch('/api/patient/scan/' + id, { headers: { Authorization: 'Bearer ' + token } });
    document.getElementById('spinner').style.display = 'none';
    if (res.ok) {
      const data = await res.json();
      renderResults(data, data);
    }
  }

  function imgPanel(icon, title, subtitle, src, altText, placeholderMsg) {
    const body = src
      ? `<img src="${src}" alt="${altText}" onerror="this.parentElement.innerHTML='<div class=\\'img-placeholder\\'><div class=\\'ph-icon\\'>⚠️</div><p>Could not load image</p></div>'">`
      : `<div class="img-placeholder"><div class="ph-icon">${icon}</div><p>${placeholderMsg}</p></div>`;
    return `
      <div class="img-panel">
        <div class="img-panel-header">
          <span class="icon">${icon}</span>
          <span class="title">${title}</span>
          <span class="subtitle">${subtitle}</span>
        </div>
        <div class="img-panel-body">${body}</div>
      </div>`;
  }

  function renderResults(aiData, fullData) {
    const conf      = aiData.confidence;
    const lowConf   = conf !== null && conf < 0.6;
    const tumorType = aiData.tumor_type;
    const detected  = aiData.tumor_detected;
    const status    = fullData && fullData.status === 'reviewed' ? '✅ Reviewed' : '⏳ Pending';

    // Badge
    let typeBadge;
    if (!detected)    typeBadge = '<span class="badge badge-notumor">🟢 No Tumor</span>';
    else if (lowConf) typeBadge = '<span class="badge badge-lowconf">⚠️ Low Confidence</span>';
    else              typeBadge = '<span class="badge badge-tumor">🔴 ' + (tumorType||'Tumor') + '</span>';

    // Image paths
    const imgSrc     = (aiData.image_path   || (fullData && fullData.image_path))   ? '/uploads/' + (aiData.image_path   || fullData.image_path)   : null;
    const overlaySrc = (aiData.overlay_path || (fullData && fullData.overlay_path)) ? '/uploads/' + (aiData.overlay_path || fullData.overlay_path) : null;
    const gradcamSrc = (aiData.gradcam_path || (fullData && fullData.gradcam_path)) ? '/uploads/' + (aiData.gradcam_path || fullData.gradcam_path) : null;

    const noTumorMsg = 'No tumor detected — overlay not generated';
    const noHeatMsg  = 'No tumor detected — heatmap not generated';

    // Doctor review block
    let reviewHtml = '';
    if (fullData && fullData.diagnosis) {
      reviewHtml = `
        <div class="doctor-review">
          <h3>✅ Doctor's Final Review</h3>
          <p><strong>Diagnosis:</strong> ${fullData.diagnosis}</p>
          ${fullData.notes ? '<p style="margin-top:8px"><strong>Notes:</strong> ' + fullData.notes + '</p>' : ''}
          <p style="margin-top:10px;color:#94a3b8;font-size:0.8rem">
            Reviewed by Dr. ${fullData.doctor_name || 'Unknown'} &nbsp;·&nbsp;
            ${new Date(fullData.reviewed_at).toLocaleString()}
          </p>
        </div>`;
    } else {
      reviewHtml = `<div class="pending-notice">⏳ Scan submitted — awaiting doctor review. The doctor's verdict will appear here once complete.</div>`;
    }

    document.getElementById('results').innerHTML = `
      <div class="section-title">Analysis Results</div>
      <div class="section-sub">AI-assisted segmentation & classification complete. A physician will review and confirm.</div>

      <!-- Metrics -->
      <div class="metrics">
        <div class="metric-card">
          <div class="label">Tumor Detection</div>
          <div class="value" style="font-size:1.1rem;margin-top:8px">${detected ? '🔴 Detected' : '🟢 Clear'}</div>
        </div>
        <div class="metric-card">
          <div class="label">AI Classification</div>
          <div style="margin-top:10px">${typeBadge}</div>
        </div>
        <div class="metric-card">
          <div class="label">AI Confidence</div>
          <div class="value">${conf !== null ? (conf*100).toFixed(1)+'%' : 'N/A'}</div>
        </div>
        <div class="metric-card">
          <div class="label">Review Status</div>
          <div class="value" style="font-size:1rem;margin-top:8px">${status}</div>
        </div>
      </div>

      <!-- Three large images -->
      <div class="images-row">
        ${imgPanel('📷','Original MRI','Raw uploaded scan', imgSrc, 'Original MRI', 'Image not available')}
        ${imgPanel('🎯','Segmentation Overlay','Tumor region outlined', overlaySrc, 'Segmentation Overlay', detected ? 'Generating...' : noTumorMsg)}
        ${imgPanel('🔥','Grad-CAM Heatmap','AI attention map', gradcamSrc, 'Grad-CAM Heatmap', detected ? 'Generating...' : noHeatMsg)}
      </div>

      <!-- Summary -->
      <div class="summary-card">
        <h4>ℹ️ AI Analysis Summary</h4>
        <div class="summary-grid">
          <div class="summary-item"><div class="key">Tumor Type</div><div class="val">${tumorType || 'N/A'}</div></div>
          <div class="summary-item"><div class="key">Confidence Score</div><div class="val">${conf !== null ? (conf*100).toFixed(2)+'%' : 'N/A'}</div></div>
          <div class="summary-item"><div class="key">Low Confidence Warning</div><div class="val">${lowConf ? '⚠️ Yes — refer to specialist' : '✅ No'}</div></div>
        </div>
        <p style="margin-top:14px;font-size:0.8rem;color:#64748b;">
          ⚠️ <strong style="color:#94a3b8">Disclaimer:</strong>
          AI results are for screening assistance only and must not replace professional clinical diagnosis.
          Always consult a certified radiologist or neurologist.
        </p>
      </div>

      ${reviewHtml}
    `;
    document.getElementById('results').style.display = 'block';
  }
</script>
</body>
</html>
